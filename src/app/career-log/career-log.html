<div class="log">
  <div class="cmd-row">
    <p class="cmd" aria-hidden="true"><span class="prompt">$</span> git log --graph --all</p>
    <button
      type="button"
      class="log-toggle"
      (click)="togglePlay()"
      [attr.aria-label]="paused() ? 'Play graph animation' : 'Pause graph animation'"
    >
      @if (paused()) {
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
          <path d="M2.5 1.2 L10.2 6 L2.5 10.8 Z" fill="currentColor" />
        </svg>
      } @else {
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
          <rect x="2" y="1.2" width="2.8" height="9.6" fill="currentColor" />
          <rect x="7.2" y="1.2" width="2.8" height="9.6" fill="currentColor" />
        </svg>
      }
    </button>
  </div>

  <canvas #canvas [style.height.px]="graphHeight" aria-hidden="true"></canvas>

  @let c = caption();
  <p class="cap" [style.--lane]="c.color">
    <span class="cap-dot" aria-hidden="true"></span>
    <span class="cap-sha">{{ c.sha }}</span>
    <span class="cap-msg">{{ c.msg }}</span>
    <span class="cap-ref">{{ c.ref }}</span>
    <span class="cap-skill">{{ c.skill }}</span>
  </p>

  <!-- The braid carries real content, so it cannot just be silent to a reader. -->
  <ol class="sr-only">
    @for (commit of log; track commit.msg) {
      <li>{{ commit.msg }}. {{ commit.skill }}.</li>
    }
  </ol>
</div>
